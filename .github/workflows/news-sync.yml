name: Actualizar titulares NBA gratis
on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['lib/news.ts', 'lib/news-store.ts', 'app/api/news/route.ts', 'collector/sync_news.mjs', '.github/workflows/news-sync.yml']
permissions:
  contents: read
concurrency:
  group: play-metric-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PLAY_METRIC_URL: https://play-metric-vercel.vercel.app
      PLAY_METRIC_SERVICE_TOKEN: ${{ secrets.COLLECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Obtener titulares y publicar el índice validado
        run: node collector/sync_news.mjs
