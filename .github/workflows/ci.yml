name: Calidad del repositorio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Instalar exactamente el lockfile
        run: npm ci
      - name: Rechazar nueva deuda de ESLint
        run: npm run lint
      - name: Comprobar tipos
        run: npm run typecheck
      - name: Pruebas de datos, seguridad y concurrencia
        run: npm test
      - name: Instalar dependencias del recolector
        run: python -m pip install -r collector/requirements.txt
      - name: Pruebas del recolector Python
        run: |
          python -m unittest discover -s collector -p 'test_*.py'
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Auditar dependencias de producción
        run: npm run audit:production
      - name: Compilar aplicación
        run: npm run build
      - name: Verificar importaciones con base sintética local
        run: node scripts/verify-update.mjs
