name: Actualizar plantillas NBA
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/sync_rosters.mjs', '.github/workflows/roster-sync.yml']
permissions:
  contents: read
concurrency:
  group: play-metric-rosters
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAY_METRIC_URL: https://play-metric-vercel.vercel.app
      PLAY_METRIC_SERVICE_TOKEN: ${{ secrets.COLLECTOR_SECRET }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validar configuración
        run: node -e "if((process.env.PLAY_METRIC_SERVICE_TOKEN??'').length<32)throw Error('Falta COLLECTOR_SECRET en Actions')"
      - name: Recoger y verificar las 30 plantillas oficiales
        run: node collector/sync_rosters.mjs --upload
